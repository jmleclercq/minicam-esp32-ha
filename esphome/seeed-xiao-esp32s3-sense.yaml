# XIAO ESP32S3 Sense (OV2640/OV3660 on the Sense expansion board)
# Shared settings (Wi-Fi, API, OTA, sensors, HTTP endpoints) live in common.yaml.

substitutions:
  devicename: minicam-esp32
  friendly_name: MiniCam ESP32

packages:
  common: !include common.yaml

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: arduino

# Required for esp32_camera on ESPHome 2026.x
psram:
  mode: octal
  speed: 80MHz

# Camera (XIAO ESP32S3 Sense)
esp32_camera:
  id: cam
  name: "${friendly_name}"
  external_clock:
    pin: GPIO10
    frequency: 20MHz
  i2c_pins:
    sda: GPIO40
    scl: GPIO39
  data_pins: [GPIO15, GPIO17, GPIO18, GPIO16, GPIO14, GPIO12, GPIO11, GPIO48]
  vsync_pin: GPIO38
  href_pin: GPIO47
  pixel_clock_pin: GPIO13

  # Stable baseline
  resolution: 640x480
  jpeg_quality: 12
  max_framerate: 10 fps
