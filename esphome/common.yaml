# Shared configuration for all MiniCam boards.
# Included by seeed-xiao-esp32s3-sense.yaml and ai-thinker-esp32-cam.yaml via `packages:`.
# Requires the substitutions `devicename` and `friendly_name` (defined in each board file).

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

# HTTP endpoints (the camera itself is configured in each board file)
esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot

# Nice-to-have diagnostics
sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "${friendly_name} Uptime"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP"

# Quick recovery button in HA
button:
  - platform: restart
    name: "${friendly_name} Restart"
