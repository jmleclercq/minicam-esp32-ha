# AI-Thinker ESP32-CAM (ESP32-S, OV2640), flashed via a programming base board or a USB-UART adapter
# Shared settings (Wi-Fi, API, OTA, sensors, HTTP endpoints) live in common.yaml.

substitutions:
  devicename: minicam-esp32cam
  friendly_name: MiniCam ESP32-CAM

packages:
  common: !include common.yaml

esp32:
  board: esp32dev
  framework:
    type: arduino

# Quad PSRAM (default mode) - do NOT use "octal" here, it is for ESP32-S3 only
psram:

# Merged into the wifi: block of common.yaml
wifi:
  power_save_mode: none  # lower latency / better stream throughput

# Camera (AI-Thinker ESP32-CAM pinout)
esp32_camera:
  id: cam
  name: "${friendly_name}"
  external_clock:
    pin: GPIO0
    frequency: 20MHz
  i2c_pins:
    sda: GPIO26
    scl: GPIO27
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32

  # Stable baseline (320x240 keeps the stream smooth on a weak Wi-Fi link)
  resolution: 320x240
  jpeg_quality: 12
  max_framerate: 10 fps

# On-board white flash LED (GPIO4). Very bright: keep it off unless needed.
output:
  - platform: ledc
    pin: GPIO4
    id: flash_output

light:
  - platform: monochromatic
    name: "${friendly_name} Flash"
    output: flash_output
    restore_mode: ALWAYS_OFF
